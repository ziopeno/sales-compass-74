<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선적 항로 관제실</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --navy-900:#091826;--navy-800:#0d2236;--navy-700:#123150;
  --paper:#f3efe6;--card:#fff;--ink:#15212c;--ink-soft:#5c6b77;--ink-faint:#8a97a1;
  --line:#e7e0d2;--line-soft:#f0ebe0;
  --teal:#0fae9e;--amber:#df8a1e;--red:#cf3b2e;--green:#2f9e57;--gold:#f4b81e;--violet:#7b5cd6;
  --font-display:'Sora',system-ui,sans-serif;--font-body:'Outfit',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0 14px;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--navy-800),var(--navy-700));display:flex;align-items:center;justify-content:center;color:#dCEef5;box-shadow:0 8px 22px -10px rgba(9,24,38,.55)}
.brand h1{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand p{font-size:12px;color:var(--ink-faint);font-weight:400;letter-spacing:.02em}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate-chip{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:9px}
.me-chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);padding:5px 11px 5px 6px;border-radius:20px;font-size:12.5px;color:var(--ink-soft)}
.me-chip select{border:none;background:none;font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--ink);padding:2px 4px;cursor:pointer;width:auto}
.me-chip .av{width:22px;height:22px;border-radius:50%;background:var(--navy-700);color:#cfe6f0;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tab{font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--ink-faint);background:none;border:none;padding:11px 16px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.15s}
.tab.on{color:var(--ink);border-color:var(--navy-800)}

.hero{position:relative;border-radius:20px;overflow:hidden;background:var(--navy-900);box-shadow:0 18px 50px -22px rgba(9,24,38,.55);margin-bottom:8px}
.hero-head{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;pointer-events:none}
.hero-title{font-family:var(--font-display);color:#eaf4f8;font-size:15px;font-weight:500}
.hero-sub{color:#7fa8bd;font-size:12px;margin-top:2px}
.hero-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.lg{display:flex;align-items:center;gap:6px;color:#9db8c8;font-size:11.5px}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.seascape{display:block;width:100%;height:auto}
.lane{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none}
.vessel{position:absolute;transform:translate(-50%,-50%);transition:left 1.1s cubic-bezier(.4,0,.2,1),top 1.1s cubic-bezier(.4,0,.2,1);pointer-events:auto}
.vessel .ship{position:relative;display:block}
.vessel.sail .ship{animation:sailmove 3.8s ease-in-out infinite}
.vessel.sail.v2 .ship{animation-duration:4.8s;animation-delay:-1.4s}
@keyframes sailmove{0%,100%{transform:translate(0,0) rotate(-1.4deg)}50%{transform:translate(3px,-5px) rotate(1.4deg)}}
.vessel.dock .ship{animation:dock 5.5s ease-in-out infinite}
@keyframes dock{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-2px) rotate(.6deg)}}
.fig-prep .figbob{animation:nod 1.9s ease-in-out infinite}
@keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.fig-prep .arm{transform-box:fill-box;transform-origin:right center;animation:hammer .9s ease-in-out infinite}
@keyframes hammer{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-42deg)}}
.fig-load .hook{animation:hook 2.4s ease-in-out infinite}
@keyframes hook{0%,100%{transform:translateY(-3px)}50%{transform:translateY(6px)}}
.fig-load .topbox{animation:settle 2.4s ease-in-out infinite}
@keyframes settle{0%,45%{opacity:.55;transform:translateY(-5px)}60%,100%{opacity:1;transform:translateY(0)}}
.wake{position:absolute;top:50%;right:100%;width:46px;height:3px;border-radius:3px;background:linear-gradient(to left,rgba(255,255,255,.55),rgba(255,255,255,0));transform:translateY(2px)}
.vessel.sail .wake{animation:wake 1.6s ease-in-out infinite}
@keyframes wake{0%,100%{opacity:.35;width:38px}50%{opacity:.8;width:52px}}
.vlabel{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;font-size:10.5px;font-weight:500;color:#dCEef5;background:rgba(9,24,38,.55);border:1px solid rgba(255,255,255,.14);padding:2px 7px;border-radius:6px}
.vlabel b{font-weight:600}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-13deg);z-index:4;pointer-events:none}
.stamp .ring{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--red);border:2.5px solid var(--red);border-radius:7px;padding:3px 7px;opacity:.92}
.stamp.fresh{animation:stampin .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampin{0%{transform:translate(-50%,-50%) rotate(-13deg) scale(2.1);opacity:0}55%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-13deg) scale(1);opacity:.92}}
.coin-wrap{position:absolute;left:50%;top:-20px;transform:translateX(-50%);perspective:70px;z-index:6;animation:cbob 2.2s ease-in-out infinite}
@keyframes cbob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.coin{width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffe79a,#f4b81e 55%,#c98a12);border:1.5px solid #b9810f;color:#7a5408;font-family:var(--font-display);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(180,130,10,.55);animation:spin 1.7s linear infinite}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.smoke{animation:rise 3.4s ease-in infinite;opacity:0}
.smoke.s2{animation-delay:1.1s}.smoke.s3{animation-delay:2.2s}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.5}100%{transform:translateY(-30px) scale(1.4);opacity:0}}
.waveband{animation:drift 9s linear infinite}.waveband.w2{animation-duration:13s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-60px)}}

.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--ink-soft);background:none;border:none;padding:7px 15px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--navy-800);color:#eaf4f8}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:500;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:6px 13px;border-radius:20px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.chip .av{width:18px;height:18px;border-radius:50%;background:var(--navy-700);color:#cfe6f0;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:600}
.chip.on{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}.chip.on .av{background:rgba(255,255,255,.2);color:#fff}
.period-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px 8px 4px 4px;font-size:12.5px;color:var(--ink-soft)}
.period-bar select{border:none;background:none;font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;width:auto;padding:4px 6px}
.spacer{flex:1}
.btn-add{font-family:var(--font-body);font-size:13.5px;font-weight:600;color:#fff;background:var(--teal);border:none;padding:10px 18px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 6px 16px -8px var(--teal);transition:.15s}
.btn-add:hover{filter:brightness(1.05);transform:translateY(-1px)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.metric .lab{font-size:12px;color:var(--ink-faint);font-weight:500}
.metric .val{font-family:var(--font-display);font-size:27px;font-weight:600;margin-top:5px;line-height:1}
.metric .val small{font-size:13px;font-weight:500;color:var(--ink-faint);margin-left:3px}
.metric.alert .val{color:var(--red)}.metric.warn .val{color:var(--amber)}

.board{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.board-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;gap:10px}
.board-head h2{font-family:var(--font-display);font-size:15px;font-weight:600}
.board-head .count{font-size:12.5px;color:var(--ink-faint)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{text-align:left;font-weight:500;color:var(--ink-faint);font-size:11.5px;letter-spacing:.03em;padding:11px 16px;background:var(--line-soft)}
.tbl thead th.r{text-align:right}
.tbl tbody tr.row{border-top:1px solid var(--line-soft);cursor:pointer;transition:background .12s}
.tbl tbody tr.row:hover{background:#faf8f2}
.tbl td{padding:13px 16px;vertical-align:middle}
.tbl td.r{text-align:right;font-family:var(--font-mono);font-size:12.5px}
.cli{font-weight:600;font-size:13.5px}.po{color:var(--ink-faint);font-size:11.5px;font-family:var(--font-mono)}
.dates{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)}
.dates .strike{text-decoration:line-through;color:var(--ink-faint)}.dates .new{color:var(--amber);font-weight:500}
.owner{display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
.owner .av{width:22px;height:22px;border-radius:50%;background:var(--navy-700);color:#cfe6f0;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap}
.b-prep{background:#eef0f2;color:#5a6b78}.b-loaded{background:#fdf1dc;color:#9a6310}.b-transit{background:#dcf4f1;color:#0a7468}.b-done{background:#e3f4e8;color:#1f7a44}.b-delay{background:#fbe6e3;color:#a8312a}
.chev{color:var(--ink-faint);transition:transform .2s}tr.open .chev{transform:rotate(90deg)}
.detail{background:#faf8f2}.detail td{padding:0}
.dwrap{padding:20px 22px;display:grid;grid-template-columns:1.15fr 1fr;gap:26px}
.dsec h4{font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:11px;display:flex;align-items:center;gap:6px}
.timeline{border-left:2px solid var(--line);padding-left:15px;display:flex;flex-direction:column;gap:13px}
.tl-item .tl-main{font-size:13px}.tl-item .tl-main b{font-weight:600}
.tl-item .tl-meta{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);margin-top:1px}
.amt-line{color:var(--amber);font-weight:600}
.cmt{display:flex;gap:9px;margin-bottom:11px}
.cmt .av{width:28px;height:28px;border-radius:50%;background:var(--navy-700);color:#cfe6f0;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.cmt .cb{font-size:13px}.cmt .cn{font-weight:600;font-size:12.5px}.cmt .ct{color:var(--ink-faint);font-size:11px;font-family:var(--font-mono);margin-left:5px}
.field{margin-bottom:13px}.field label{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:500;margin-bottom:5px}
.ctrls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-top:6px}.ctrls h4{margin-bottom:13px}
input,select,textarea{font-family:var(--font-body);font-size:13px;width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:none;transition:.12s}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,174,158,.13)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.statusbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.sbtn{font-family:var(--font-body);font-size:12.5px;font-weight:600;padding:10px 8px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;transition:.13s;display:flex;align-items:center;justify-content:center;gap:5px}
.sbtn:hover{border-color:var(--navy-700);color:var(--ink)}
.sbtn.on{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
.sbtn.gold.on{background:linear-gradient(135deg,#f4b81e,#d68a12);border-color:#c98a12;color:#3d2c05}
.btn{font-family:var(--font-body);font-size:13px;font-weight:600;padding:8px 15px;border-radius:9px;border:none;cursor:pointer;transition:.12s}
.btn-pri{background:var(--navy-800);color:#fff}.btn-pri:hover{filter:brightness(1.15)}
.btn-soft{background:#eef0f2;color:var(--ink-soft)}
.btn-row{display:flex;gap:8px;margin-top:4px}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.empty{padding:42px;text-align:center;color:var(--ink-faint);font-size:13px}
.auto-calc{background:#f7f4ec;border:1px dashed var(--line);border-radius:9px;padding:10px 12px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.auto-calc b{color:var(--ink);font-weight:600}

/* revenue */
.rev-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.rates{display:flex;gap:10px;flex-wrap:wrap}
.rate-in{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 11px}
.rate-in label{font-size:12px;color:var(--ink-soft);font-weight:500;white-space:nowrap}
.rate-in input{width:78px;padding:5px 8px;font-family:var(--font-mono);font-size:12.5px;text-align:right}
.rcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.rcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.rcard.plan::before{background:#c9c3b4}
.rcard.est::before{background:var(--teal)}
.rcard.act::before{background:var(--green)}
.rcard.gap::before{background:var(--red)}
.rcard .lab{font-size:12px;color:var(--ink-faint);font-weight:500}
.rcard .val{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:6px;line-height:1.15}
.rcard .sub{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.rcard.plan .val{color:var(--ink)}.rcard.est .val{color:var(--teal)}.rcard.act .val{color:var(--green)}
.rcard.gap .val.neg{color:var(--red)}.rcard.gap .val.pos{color:var(--green)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.panel-head h3{font-family:var(--font-display);font-size:15px;font-weight:600}
.rlegend{display:flex;gap:14px;flex-wrap:wrap}.rlegend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.rlegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chart{display:flex;align-items:flex-end;gap:10px;height:230px;border-bottom:1px solid var(--line);padding-bottom:0;overflow-x:auto;padding-top:20px}
.rg{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:48px;flex:1;position:relative}
.rbars{display:flex;align-items:flex-end;gap:5px;height:180px;position:relative}
.rbar{width:17px;border-radius:3px 3px 0 0;transition:height .5s cubic-bezier(.4,0,.2,1);position:relative}
.rbar.plan{background:repeating-linear-gradient(45deg,#c9c3b4 0 5px,#bcb5a3 5px 10px)}
.rbar.est{background:linear-gradient(to top,var(--teal),#3dd0c0)}
.rgap-line{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--red);pointer-events:none}
.rgap-txt{position:absolute;top:-16px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--red);white-space:nowrap}
.rlab{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);text-align:center}
.rlab b{display:block;color:var(--ink);font-family:var(--font-body);font-weight:600;font-size:12px;margin-top:2px}
.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl th{text-align:right;font-weight:500;color:var(--ink-faint);font-size:11.5px;padding:9px 12px;background:var(--line-soft)}
.rtbl th:first-child{text-align:left}
.rtbl td{padding:10px 12px;text-align:right;font-family:var(--font-mono);font-size:12.5px;border-top:1px solid var(--line-soft)}
.rtbl td:first-child{text-align:left;font-family:var(--font-body);font-weight:500}
.rtbl td .usd{display:block;color:var(--ink-faint);font-size:11px}
.plan-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.plan-tbl th{font-size:11px;color:var(--ink-faint);font-weight:500;padding:8px 6px;background:var(--line-soft);text-align:left}
.plan-tbl td{padding:6px;border-top:1px solid var(--line-soft);vertical-align:middle}
.plan-tbl td input,.plan-tbl td select{padding:6px 8px;font-size:12px}
.plan-tbl td.num input{font-family:var(--font-mono);text-align:right}
.plan-tbl td.calc{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);text-align:right;white-space:nowrap}
.plan-tbl td .calc-usd{color:var(--ink);font-weight:600}
.owner-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.owner-tabs .chip{cursor:pointer}
.pgbar{display:inline-block;width:140px;height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;vertical-align:middle}
.pgfill{height:100%;background:linear-gradient(90deg,var(--teal),#3dd0c0);border-radius:4px;transition:width .4s}
.owner-block{margin-bottom:22px;padding-bottom:18px;border-bottom:1px dashed var(--line)}
.owner-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.owner-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.owner-head .ol{display:flex;align-items:center;gap:9px}
.owner-head .ol .av{width:26px;height:26px;border-radius:50%;background:var(--navy-700);color:#cfe6f0;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:600}
.owner-head b{font-family:var(--font-display);font-size:14px}
.owner-head .meta{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono)}
.owner-head .ach{font-family:var(--font-mono);font-size:14px;font-weight:700}
.dim-seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.dim-seg button{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--ink-soft);background:none;border:none;padding:6px 11px;border-radius:7px;cursor:pointer;transition:.15s}
.dim-seg button.on{background:var(--navy-800);color:#eaf4f8}
.due-pill{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--line-soft);color:var(--ink-soft)}
.due-pill.soon{background:#fdf1dc;color:#9a6310}
.due-pill.over{background:#fbe6e3;color:var(--red)}
@media(max-width:760px){.metrics,.rcards{grid-template-columns:repeat(2,1fr)}.dwrap{grid-template-columns:1fr}.board{overflow-x:auto}.tbl{min-width:780px}}

.overlay{position:fixed;inset:0;background:rgba(9,24,38,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:18px;width:620px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(9,24,38,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line-soft)}
.modal-head h3{font-family:var(--font-display);font-size:17px;font-weight:600}
.modal-head .x{background:none;border:none;font-size:22px;color:var(--ink-faint);cursor:pointer;line-height:1}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:9px}

/* wheel picker */
.wheel-overlay{position:fixed;inset:0;background:rgba(9,24,38,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.wheel-overlay.show{display:flex}
.wheel-modal{background:var(--card);border-radius:18px;width:360px;max-width:100%;box-shadow:0 30px 80px -20px rgba(9,24,38,.5);overflow:hidden}
.wheel-head{padding:15px 22px;font-family:var(--font-display);font-weight:600;font-size:14px;border-bottom:1px solid var(--line-soft);color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center}
.wheel-head small{font-weight:400;font-size:11px;color:var(--ink-faint)}
.wheel-cols{display:flex;gap:8px;padding:14px 22px;position:relative;background:linear-gradient(180deg,#fafaf6,#f1ede2)}
.wheel-center{position:absolute;left:22px;right:22px;top:50%;height:36px;transform:translateY(-50%);border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none;background:rgba(15,174,158,.07);border-radius:5px}
.wheel-col{flex:1;height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center;cursor:grab;user-select:none;position:relative;z-index:1}
.wheel-col:active{cursor:grabbing}
.wheel-col::-webkit-scrollbar{display:none}
.wpad{height:72px}
.wheel-item{height:36px;line-height:36px;font-family:var(--font-mono);font-size:13.5px;color:var(--ink-faint);scroll-snap-align:center;scroll-snap-stop:always;transition:color .15s,font-size .15s,font-weight .15s}
.wheel-item.cur{color:var(--ink);font-weight:600;font-size:15.5px}
.wheel-foot{padding:12px 22px 16px;display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line-soft);background:#fff}
.wtrig{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;color:var(--ink);width:100%;min-height:35px;transition:.12s}
.wtrig:hover{border-color:var(--teal);background:#fafaf6}
.wtrig.empty{color:var(--ink-faint)}
.wtrig svg{color:var(--ink-faint);flex-shrink:0;margin-left:6px}
.neg-area{font-family:var(--font-body);font-size:13px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fffef9;color:var(--ink);outline:none;resize:vertical;min-height:70px;line-height:1.5}
.neg-area:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,174,158,.13)}
.neg-saved{font-size:10.5px;color:var(--teal);margin-left:8px;opacity:0;transition:opacity .25s}
.neg-saved.on{opacity:1}

.soi{display:flex;gap:6px}
.soi select{flex:1}
.soi input{flex:1}
</style>

const fmtD=s=>s?s.slice(5).replace('-','/'):'—';
const fmtT=s=>{const d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const initials=n=>n?n.slice(0,2):'??';
const isDone=s=>s.status==='수금 완료';
function isDelayed(s){if(isDone(s))return false;const st=META[s.status].stage;if((st==='factory'||st==='port')&&s.etd&&s.etd<iso(0))return true;if(s.eta&&s.eta<iso(0))return true;return false;}
const changedToday=s=>s.history.some(h=>h.at.slice(0,10)===iso(0));
const usdOf=s=>(s.qty||0)*(s.price||0);
const krwOf=s=>{const st=META[s.status].stage;return (st==='sea'||st==='done')&&s.krwActual?s.krwActual:Math.round(usdOf(s)*settings.estRate);};
function won(v){v=Math.round(v);const sign=v<0?'-':'';v=Math.abs(v);if(v>=1e8)return sign+'₩'+(v/1e8).toFixed(2)+'억';if(v>=1e4)return sign+'₩'+Math.round(v/1e4).toLocaleString()+'만';return sign+'₩'+v.toLocaleString();}
function usd(v){v=Math.round(v);const sign=v<0?'-':'';v=Math.abs(v);if(v>=1e6)return sign+'$'+(v/1e6).toFixed(2)+'M';if(v>=1e3)return sign+'$'+(v/1e3).toFixed(1)+'K';return sign+'$'+v.toLocaleString();}
function addDays(isoStr,d){const dt=new Date(isoStr+'T00:00:00');dt.setDate(dt.getDate()+d);return dt.toISOString().slice(0,10);}
function dueDate(s){const base=s.atd||s.eta;if(!base)return null;return addDays(base,s.terms||0);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}

let soiSeq=0;
function soiHtml(id,items,val,onChange){
  // returns markup for select + hidden input that toggles when "직접 입력" picked
  const isCustom=val&&!items.includes(val);
  const opts=['<option value="">선택</option>',...items.map(i=>`<option value="${i.replace(/"/g,'&quot;')}" ${i===val?'selected':''}>${i}</option>`),`<option value="__custom__" ${isCustom?'selected':''}>직접 입력</option>`].join('');
  return `<div class="soi" data-soi="${id}">
    <select onchange="soiPick('${id}',this.value)">${opts}</select>
    <input style="display:${isCustom?'block':'none'}" placeholder="직접 입력" value="${isCustom?val:''}" oninput="soiInput('${id}',this.value)">
  </div>`;
}
const soiCb={};
function soiPick(id,v){
  const box=document.querySelector(`[data-soi="${id}"]`);const inp=box.querySelector('input');
  if(v==='__custom__'){inp.style.display='block';inp.value='';inp.focus();if(soiCb[id])soiCb[id]('');return;}
  inp.style.display='none';inp.value='';
  if(soiCb[id])soiCb[id](v);
}
function soiInput(id,v){if(soiCb[id])soiCb[id](v);}
function soiValue(id){const box=document.querySelector(`[data-soi="${id}"]`);if(!box)return '';const s=box.querySelector('select').value;if(s==='__custom__')return box.querySelector('input').value.trim();return s;}

/* ---- board period filter ---- */
function getDateOf(s){return s.atd||s.etd;}
function inPeriod(s){
  if(boardGran==='all')return true;
  const d=getDateOf(s);if(!d)return false;
  const dt=new Date(d);const y=dt.getFullYear(),m=dt.getMonth()+1,q=Math.floor((m-1)/3)+1;
  if(boardGran==='year')return String(y)===boardPeriod;
  if(boardGran==='quarter')return (y+'-Q'+q)===boardPeriod;
  if(boardGran==='month')return (y+'-'+String(m).padStart(2,'0'))===boardPeriod;
  return true;
}
const visible=()=>{
  let arr=scope.mode==='person'&&scope.person?state.filter(s=>s.owner===scope.person):state;
  return arr.filter(inPeriod);
};
function populateBoardPeriods(){
  const sel=document.getElementById('boardPeriod');
  if(boardGran==='all'){sel.innerHTML='<option value="all">전체</option>';sel.value='all';sel.disabled=true;return;}
  sel.disabled=false;
  const dates=state.map(getDateOf).filter(Boolean);
  const opts=new Set();
  dates.forEach(d=>{const dt=new Date(d);const y=dt.getFullYear(),m=dt.getMonth()+1,q=Math.floor((m-1)/3)+1;
    if(boardGran==='year')opts.add(String(y));
    else if(boardGran==='quarter')opts.add(y+'-Q'+q);
    else opts.add(y+'-'+String(m).padStart(2,'0'));});
  const list=[...opts].sort().reverse();
  if(!list.includes(boardPeriod))boardPeriod=list[0]||'all';
  sel.innerHTML=list.map(p=>`<option ${p===boardPeriod?'selected':''}>${p}</option>`).join('')||'<option>없음</option>';
}

  list.forEach(s=>{const st=META[s.status].stage;groups[st==='done'?'dest':st].push(s);});
  let html='';
  const place=(arr,xmin,xmax)=>arr.forEach((s,i)=>{
    const x=arr.length===1?(xmin+xmax)/2:xmin+(xmax-xmin)*(i/(arr.length-1));
    const top=62+(i%3-1)*10;const stage=META[s.status].stage;const done=stage==='done';
    let cls,svg,wake='';
    if(stage==='factory'){cls='fig-prep';svg=workerSVG();}
    else if(stage==='port'){cls='fig-load';svg=containerSVG();}
    else if(stage==='sea'){cls='sail v'+(i%2+1);svg=shipSVG('#19c5b4');wake='<span class="wake"></span>';}
    else{cls='dock';svg=shipSVG('#cf3b2e');}
    html+=`<div class="vessel ${cls}" style="left:${x}%;top:${top}%" title="${s.client} · ${s.status}">
      ${done?`<div class="coin-wrap"><div class="coin">$</div></div>`:''}

    if(s._fresh)delete s._fresh;
  });
  place(groups.factory,5,12);place(groups.port,20,26);place(groups.sea,36,70);place(groups.dest,82,92);
  lane.innerHTML=html;
}

function wtrigDate(id,key,val){
  const txt=val?val.slice(0,4)+'.'+val.slice(5,7)+'.'+val.slice(8,10):'';
  return `<button type="button" class="wtrig ${val?'':'empty'}" onclick="pickDate('${id}','${key}')">${txt||'날짜 선택'}<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2"/></svg></button>`;
}
function wtrigList(id,key,val,items,fmt){
  const f=fmt||(v=>String(v));
  return `<button type="button" class="wtrig ${val!==undefined&&val!==null&&val!==''?'':'empty'}" onclick='pickList("${id}","${key}",[${items.map(i=>typeof i==='number'?i:`"${i}"`).join(',')}],${fmt?'true':'false'})'>${val!==undefined&&val!==''?f(val):'선택'}<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2"/></svg></button>`;
}
function pickDate(id,key){const s=find(id);openDateWheel(({release:'출고일',etd:'ETD(ATD)',eta:'선적일 (ETA)'})[key],s[key],v=>updateField(id,key,v));}
function pickList(id,key,items,withDays){
  const s=find(id);const fmt=withDays?(v=>v+'일'):(v=>v);
  openListWheel(key==='inco'?'인코텀즈':'수금기간',items,s[key],v=>updateField(id,key,v),fmt);
}
function updateField(id,key,val){const s=find(id);const old=s[key];if(String(old==null?'':old)===String(val==null?'':val))return;
  const labels={release:'출고일',etd:'ETD(ATD)',eta:'선적일',inco:'인코텀즈',terms:'수금기간'};
  let disp;
  if(key==='terms')disp=(old||0)+'일 → '+(val||0)+'일';
  else if(key==='inco')disp=(old||'-')+' → '+(val||'-');
  else disp=(old?fmtD(old):'—')+' → '+(val?fmtD(val):'—');
  if(key==='etd'&&old)s.prevEtd=old;
  s[key]=val;
  s.history.push({who:me,text:labels[key]+' 변경',amt:disp,at:now()});
  saveAll();render();}
let negTimers={};
function saveNeg(id){const ta=document.querySelector(`[data-neg="${id}"]`);const s=find(id);s.negotiation=ta.value;clearTimeout(negTimers[id]);negTimers[id]=setTimeout(()=>{saveAll();const tag=document.querySelector(`[data-saved="${id}"]`);if(tag){tag.classList.add('on');setTimeout(()=>tag.classList.remove('on'),1200);}},350);}

let shipPendingId=null;
function openShipModal(id){shipPendingId=id;const s=find(id);
  document.getElementById('sf_atd').value=s.atd||iso(0);
  document.getElementById('sf_rate').value=s.shipRate||settings.estRate;
  recalcShip();
  document.getElementById('shipOverlay').classList.add('show');}
function closeShip(){document.getElementById('shipOverlay').classList.remove('show');shipPendingId=null;}
function recalcShip(){if(!shipPendingId)return;const s=find(shipPendingId);const r=Number(document.getElementById('sf_rate').value)||0;
  document.getElementById('sf_usd').textContent='$'+usdOf(s).toLocaleString();
  document.getElementById('sf_krw').textContent='₩'+Math.round(usdOf(s)*r).toLocaleString();}
document.getElementById('sf_rate').addEventListener('input',recalcShip);
document.getElementById('sf_save').onclick=()=>{const s=find(shipPendingId);const atd=document.getElementById('sf_atd').value,r=Number(document.getElementById('sf_rate').value)||0;
  if(!r){alert('환율을 입력하세요');return;}
  s.atd=atd||iso(0);s.shipRate=r;s.krwActual=Math.round(usdOf(s)*r);s.status='선적 완료';
  s.history.push({who:me,text:'선적 완료 · 실적 전환',amt:'ATD '+fmtD(s.atd)+' / 환율 ₩'+r.toLocaleString(),at:now()});
  closeShip();saveAll();render();if(document.getElementById('revenueView').style.display!=='none')renderRevenue();if(document.getElementById('arView').style.display!=='none')renderAR();};

let payPendingId=null;
function openPayModal(id){payPendingId=id;const s=find(id);
  document.getElementById('pf_date').value=s.paidAt||iso(0);
  document.getElementById('pf_usd').textContent='$'+usdOf(s).toLocaleString();
  document.getElementById('pf_krw').textContent='₩'+(s.krwActual||Math.round(usdOf(s)*settings.estRate)).toLocaleString();
  document.getElementById('payOverlay').classList.add('show');}
function closePay(){document.getElementById('payOverlay').classList.remove('show');payPendingId=null;}
document.getElementById('pf_save').onclick=()=>{const s=find(payPendingId);const d=document.getElementById('pf_date').value||iso(0);
  s.paidAt=d;s.status='수금 완료';s._fresh=true;
  if(!s.atd)s.atd=iso(0);if(!s.shipRate)s.shipRate=settings.estRate;if(!s.krwActual)s.krwActual=Math.round(usdOf(s)*s.shipRate);
  s.history.push({who:me,text:'수금 완료',amt:'수금일 '+fmtD(d),at:now()});
  closePay();saveAll();render();if(document.getElementById('arView').style.display!=='none')renderAR();if(document.getElementById('revenueView').style.display!=='none')renderRevenue();};
document.getElementById('payOverlay').addEventListener('click',e=>{if(e.target.id==='payOverlay')closePay();});

function changeStatus(id,val){const s=find(id);if(val===s.status)return;
  if(val==='선적 완료'){openShipModal(id);return;}
  if(val==='수금 완료'){openPayModal(id);return;}
  const before=s.status;s.status=val;
  s.history.push({who:me,text:'상태 변경',amt:before+' → '+val,at:now()});
  saveAll();render();}

/* ---------- revenue ---------- */
function isShipped(s){const st=META[s.status].stage;return st==='sea'||st==='done';}
function shipmentDate(s){return s.atd||s.etd;}
function shipmentMonth(s){const d=shipmentDate(s);if(!d)return -1;const dt=new Date(d+'T00:00:00');return dt.getFullYear()===revYear?dt.getMonth():-1;}
function shipUsd(s){return usdOf(s);}
function shipKrw(s){if(isShipped(s)&&s.krwActual)return s.krwActual;return Math.round(usdOf(s)*(s.shipRate||settings.estRate));}

function planUsdFor(owner,monthIdx){
  const ob=(settings.planByOwner&&settings.planByOwner[owner])||{};
  const arr=ob[revYear+'-'+(monthIdx+1)]||[];
  return arr.reduce((a,p)=>{
    if(p.product==='테라도 비용정산')return a+(Number(p.directUsd)||0);
    return a+(Number(p.qty)||0)*(Number(p.price)||0);
  },0);
}

function revData(gran,ownerFilter){
  const m=Array.from({length:12},()=>({plan:0,est:0,act:0,planUsd:0,estUsd:0,actUsd:0}));
  const ownersForPlan=ownerFilter==='all'?OWNERS:[ownerFilter];
  ownersForPlan.forEach(o=>{for(let i=0;i<12;i++){const u=planUsdFor(o,i);m[i].planUsd+=u;m[i].plan+=u*settings.planRate;}});
  state.forEach(s=>{
    if(ownerFilter!=='all'&&s.owner!==ownerFilter)return;
    const mi=shipmentMonth(s);if(mi<0)return;
    const u=shipUsd(s);const k=shipKrw(s);
    // 추정(실적) = ALL entered for this period
    m[mi].est+=k;m[mi].estUsd+=u;
    // 실적 = only those shipped
    if(isShipped(s)){m[mi].act+=k;m[mi].actUsd+=u;}
  });
  if(gran==='month')return m.map((x,i)=>({label:(i+1)+'월',...x}));
  if(gran==='quarter')return [0,1,2,3].map(q=>{const a={plan:0,est:0,act:0,planUsd:0,estUsd:0,actUsd:0,label:'Q'+(q+1)};for(let k=0;k<3;k++){['plan','est','act','planUsd','estUsd','actUsd'].forEach(f=>a[f]+=m[q*3+k][f]);}return a;});
  const t={plan:0,est:0,act:0,planUsd:0,estUsd:0,actUsd:0,label:revYear+'년'};m.forEach(x=>['plan','est','act','planUsd','estUsd','actUsd'].forEach(f=>t[f]+=x[f]));return [t];}

function periodMonths(){
  if(revGran==='year')return [...Array(12).keys()];
  if(revGran==='quarter'){const q=Math.floor(today.getMonth()/3);return [q*3,q*3+1,q*3+2];}
  return [today.getMonth()];
}

function dimKey(s,dim){
  if(dim==='country')return s.country||'-';
  if(dim==='owner')return s.owner||'-';
  if(dim==='cat1')return s.cat1||'-';
  if(dim==='cat2')return s.cat2||'-';
  if(dim==='team')return TEAM[s.owner]||'-';
  if(dim==='client')return s.client||'-';
  if(dim==='product')return s.item||'-';
  return '-';
}

function breakdownByDim(dim){
  const months=periodMonths();
  // plan total (per owner) for the period
  const ownersForPlan=revOwner==='all'?OWNERS:[revOwner];
  // Plan only has owner dimension; for non-owner/team dims we show "—"
  const planByOwner={};
  ownersForPlan.forEach(o=>{planByOwner[o]=months.reduce((a,mi)=>a+planUsdFor(o,mi),0);});

  const groups={};
  state.forEach(s=>{
    if(revOwner!=='all'&&s.owner!==revOwner)return;
    const mi=shipmentMonth(s);if(mi<0||!months.includes(mi))return;
    const k=dimKey(s,dim);if(!groups[k])groups[k]={estUsd:0,estKrw:0,actUsd:0,actKrw:0,planUsd:0,planKrw:0};
    const u=shipUsd(s);const kr=shipKrw(s);
    groups[k].estUsd+=u;groups[k].estKrw+=kr;
    if(isShipped(s)){groups[k].actUsd+=u;groups[k].actKrw+=kr;}
  });
  // Map plan totals by dim if dim is owner/team
  if(dim==='owner'){
    Object.entries(planByOwner).forEach(([o,u])=>{if(!groups[o])groups[o]={estUsd:0,estKrw:0,actUsd:0,actKrw:0,planUsd:0,planKrw:0};groups[o].planUsd=u;groups[o].planKrw=u*settings.planRate;});
  }else if(dim==='team'){
    Object.entries(planByOwner).forEach(([o,u])=>{const t=TEAM[o]||'-';if(!groups[t])groups[t]={estUsd:0,estKrw:0,actUsd:0,actKrw:0,planUsd:0,planKrw:0};groups[t].planUsd+=u;groups[t].planKrw+=u*settings.planRate;});
  }
  return Object.entries(groups).sort((a,b)=>b[1].estKrw-a[1].estKrw);
}

function renderRevenue(){
  const data=revData(revGran,revOwner);
  const tot=data.reduce((a,d)=>({plan:a.plan+d.plan,est:a.est+d.est,act:a.act+d.act,planUsd:a.planUsd+d.planUsd,estUsd:a.estUsd+d.estUsd,actUsd:a.actUsd+d.actUsd}),{plan:0,est:0,act:0,planUsd:0,estUsd:0,actUsd:0});
  const ach=tot.plan?Math.round(tot.est/tot.plan*100):0;
  const gapKrw=tot.est-tot.plan,gapUsd=tot.estUsd-tot.planUsd;
  const max=Math.max(...data.map(d=>Math.max(d.plan,d.est)),1);

  const bars=data.map(d=>{const ph=d.plan/max*180,eh=d.est/max*180;
    const gap=d.est-d.plan;
    return `<div class="rg">
      <div class="rbars">
        <div class="rbar plan" style="height:${ph}px" title="계획 ${won(d.plan)}"></div>
        <div class="rbar est" style="height:${eh}px" title="추정(실적) ${won(d.est)}"></div>
        ${d.plan>0?`<div class="rgap-line" style="bottom:${ph}px"></div><div class="rgap-txt" style="bottom:${ph}px;left:50%;transform:translateX(-50%)">${gap>=0?'+':''}${won(gap)}</div>`:''}
      </div>
      <div class="rlab"><b>${d.label}</b>계획 ${won(d.plan)}<br>추정 ${won(d.est)}</div>
    </div>`;}).join('');

  const trows=data.map(d=>{const a=d.plan?Math.round(d.est/d.plan*100):0,g=d.est-d.plan,gu=d.estUsd-d.planUsd;
    return `<tr><td>${d.label}</td>
      <td>${won(d.plan)}<span class="usd">${usd(d.planUsd)}</span></td>
      <td style="color:var(--teal)">${won(d.est)}<span class="usd">${usd(d.estUsd)}</span></td>
      <td style="color:var(--green)">${won(d.act)}<span class="usd">${usd(d.actUsd)}</span></td>
      <td style="color:${g>=0?'var(--green)':'var(--red)'}">${g>=0?'+':''}${won(g)}<span class="usd">${gu>=0?'+':''}${usd(gu)}</span></td>
      <td style="font-weight:600;color:${a>=100?'var(--green)':a>=70?'var(--amber)':'var(--red)'}">${a}%</td></tr>`;}).join('');

  // Breakdown
  const dims=[['owner','담당자'],['team','그룹(팀)'],['country','국가'],['cat1','구분1'],['cat2','구분2'],['client','거래처'],['product','제품명']];
  const dimSeg=dims.map(([k,n])=>`<button class="${revDim===k?'on':''}" onclick="setDim('${k}')">${n}</button>`).join('');
  const brk=breakdownByDim(revDim);
  const brkRows=brk.length?brk.map(([k,g])=>{
    const a=g.planKrw?Math.round(g.estKrw/g.planKrw*100):0;
    const planCell=g.planKrw?`${won(g.planKrw)}<span class="usd">${usd(g.planUsd)}</span>`:`<span style="color:var(--ink-faint)">—</span>`;
    const achCell=g.planKrw?`<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px"><div class="pgbar"><div class="pgfill" style="width:${Math.min(100,a)}%"></div></div><span style="font-family:var(--font-mono);font-size:12px;min-width:38px;text-align:right;color:${a>=100?'var(--green)':a>=70?'var(--amber)':'var(--red)'};font-weight:600">${a}%</span></div>`:`<span style="color:var(--ink-faint)">—</span>`;
    return `<tr><td>${k}</td><td>${planCell}</td><td style="color:var(--teal)">${won(g.estKrw)}<span class="usd">${usd(g.estUsd)}</span></td><td style="color:var(--green)">${won(g.actKrw)}<span class="usd">${usd(g.actUsd)}</span></td><td>${achCell}</td></tr>`;
  }).join(''):`<tr><td colspan="5" style="text-align:center;color:var(--ink-faint);padding:18px">데이터 없음</td></tr>`;

  // Plan input
  const ownerForPlan=revOwner==='all'?me:revOwner;
  const planUI=planEditor(ownerForPlan);

  document.getElementById('revenueView').innerHTML=`
    <div class="rev-head">
      <div class="seg" id="granSeg"><button class="${revGran==='month'?'on':''}" onclick="setGran('month')">월별</button><button class="${revGran==='quarter'?'on':''}" onclick="setGran('quarter')">분기별</button><button class="${revGran==='year'?'on':''}" onclick="setGran('year')">연간</button></div>
      <div class="spacer"></div>
      <div class="rates">
        <div class="rate-in"><label>계획환율</label><input type="number" value="${settings.planRate}" onchange="setRate('planRate',this.value)"></div>
        <div class="rate-in"><label>추정환율</label><input type="number" value="${settings.estRate}" onchange="setRate('estRate',this.value)"></div>
      </div>
    </div>

    <div class="owner-tabs">
      <span style="font-size:12px;color:var(--ink-faint);padding:6px 4px">담당자</span>
      <button class="chip ${revOwner==='all'?'on':''}" onclick="setRevOwner('all')">팀 전체</button>
      ${OWNERS.map(o=>`<button class="chip ${revOwner===o?'on':''}" onclick="setRevOwner('${o}')"><span class="av">${initials(o)}</span>${o} <span style="color:var(--ink-faint);margin-left:4px;font-size:10.5px">${TEAM[o]}</span></button>`).join('')}
    </div>

    <div class="rcards">
      <div class="rcard plan"><div class="lab">계획 매출</div><div class="val">${won(tot.plan)}</div><div class="sub">${usd(tot.planUsd)}</div></div>
      <div class="rcard est"><div class="lab">추정 (실적)</div><div class="val">${won(tot.est)}</div><div class="sub">${usd(tot.estUsd)} · 입력된 매출 총합</div></div>
      <div class="rcard act"><div class="lab">실적 (선적완료)</div><div class="val">${won(tot.act)}</div><div class="sub">${usd(tot.actUsd)}</div></div>
      <div class="rcard gap"><div class="lab">계획대비 차질</div><div class="val ${gapKrw>=0?'pos':'neg'}">${gapKrw>=0?'+':''}${won(gapKrw)}</div><div class="sub">${gapUsd>=0?'+':''}${usd(gapUsd)} · 달성 ${ach}%</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>계획 vs 추정(실적)</h3><div class="rlegend"><span><i style="background:repeating-linear-gradient(45deg,#c9c3b4 0 4px,#bcb5a3 4px 8px)"></i>계획</span><span><i style="background:var(--teal)"></i>추정(실적)</span><span><i style="background:var(--red);height:2px;border-radius:0"></i>차질</span></div></div>
      <div class="chart">${bars}</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>기간별 매출 (원화 / USD)</h3></div>
      <div style="overflow-x:auto"><table class="rtbl"><thead><tr><th>기간</th><th>계획</th><th>추정(실적)</th><th>실적(선적완료)</th><th>차질</th><th>달성률</th></tr></thead><tbody>${trows}</tbody></table></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>구분별 계획 vs 추정(실적)</h3><div class="dim-seg">${dimSeg}</div></div>
      <div style="overflow-x:auto"><table class="rtbl"><thead><tr><th>${dims.find(d=>d[0]===revDim)[1]}</th><th>계획</th><th>추정(실적)</th><th>실적(선적완료)</th><th>달성률</th></tr></thead><tbody>${brkRows}</tbody></table></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>담당자별 목표 달성률 <span style="color:var(--ink-faint);font-weight:400;font-size:12px">(${revGran==='month'?(today.getMonth()+1)+'월':revGran==='quarter'?'Q'+(Math.floor(today.getMonth()/3)+1):revYear+'년'} 기준 · 제품별 / 전체)</span></h3></div>
      ${ownerItemPanel()}
    </div>

    <div class="panel">
      <div class="panel-head"><h3>${ownerForPlan}의 계획 매출 입력 <span style="color:var(--ink-faint);font-weight:400;font-size:12px">(월별 · 품목 단가 입력시 USD/원화 자동 계산)</span></h3></div>
      ${planUI}
    </div>`;
  updateChip();}

function ownerItemPanel(){
  const months=periodMonths();
  const inP=mi=>months.includes(mi);
  const map={};
  state.forEach(s=>{
    if(revOwner!=='all'&&s.owner!==revOwner)return;
    const mi=shipmentMonth(s);if(mi<0||!inP(mi))return;
    const u=shipUsd(s),k=shipKrw(s);
    if(!map[s.owner])map[s.owner]={};
    if(!map[s.owner][s.item])map[s.owner][s.item]={usd:0,krw:0,actUsd:0,actKrw:0};
    map[s.owner][s.item].usd+=u;map[s.owner][s.item].krw+=k;
    if(isShipped(s)){map[s.owner][s.item].actUsd+=u;map[s.owner][s.item].actKrw+=k;}
  });
  const planByOwner={};
  OWNERS.forEach(o=>{let total=0;months.forEach(mi=>{total+=planUsdFor(o,mi);});planByOwner[o]={usd:total,krw:total*settings.planRate};});
  const list=revOwner==='all'?OWNERS:[revOwner];
  return list.map(o=>{
    const items=map[o]||{};const plan=planByOwner[o]||{usd:0,krw:0};
    const totalKrw=Object.values(items).reduce((a,b)=>a+b.krw,0);
    const totalUsd=Object.values(items).reduce((a,b)=>a+b.usd,0);
    const totalActKrw=Object.values(items).reduce((a,b)=>a+b.actKrw,0);
    const ach=plan.krw?Math.round(totalKrw/plan.krw*100):0;
    const actAch=plan.krw?Math.round(totalActKrw/plan.krw*100):0;
    const rows=Object.entries(items).sort((a,b)=>b[1].krw-a[1].krw).map(([item,d])=>{
      const pct=plan.krw?Math.round(d.krw/plan.krw*100):0;
      const actPct=plan.krw?Math.round(d.actKrw/plan.krw*100):0;
      return `<tr><td>${item}</td>
        <td>${won(d.krw)}<span class="usd">${usd(d.usd)}</span></td>
        <td style="color:var(--green)">${won(d.actKrw)}<span class="usd">${usd(d.actUsd)}</span></td>
        <td><div style="display:flex;align-items:center;justify-content:flex-end;gap:8px"><div class="pgbar"><div class="pgfill" style="width:${Math.min(100,pct)}%"></div></div><span style="font-family:var(--font-mono);font-size:12px;min-width:38px;text-align:right">${pct}%</span></div><div style="font-size:10.5px;color:var(--green);text-align:right;margin-top:3px">실적 ${actPct}%</div></td></tr>`;
    }).join('')||`<tr><td colspan="4" style="color:var(--ink-faint);text-align:center;padding:18px">데이터 없음</td></tr>`;
    return `<div class="owner-block">
      <div class="owner-head">
        <div class="ol"><span class="av">${initials(o)}</span><b>${o}</b><span class="meta">${TEAM[o]} · 계획 ${won(plan.krw)} · ${usd(plan.usd)}</span></div>
        <div style="text-align:right">
          <div class="ach" style="color:${ach>=100?'var(--green)':ach>=70?'var(--amber)':'var(--red)'}">추정 ${ach}%</div>
          <div style="font-size:11px;color:var(--green);font-family:var(--font-mono);font-weight:600">실적 ${actAch}%</div>
        </div>
      </div>
      <table class="rtbl"><thead><tr><th>제품</th><th>추정(실적)</th><th>실적(선적완료)</th><th style="text-align:right">계획 대비 비중</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');
}

function planEditor(owner){
  const monthsToShow=revGran==='month'?[today.getMonth()]:revGran==='quarter'?(()=>{const q=Math.floor(today.getMonth()/3);return [q*3,q*3+1,q*3+2];})():[...Array(12).keys()];
  return monthsToShow.map(mi=>{
    const key=revYear+'-'+(mi+1);
    const arr=(settings.planByOwner[owner]&&settings.planByOwner[owner][key])||[];
    const rows=arr.map((p,i)=>planRow(owner,mi,i,p)).join('');
    const total=arr.reduce((a,p)=>a+(p.product==='테라도 비용정산'?Number(p.directUsd)||0:(Number(p.qty)||0)*(Number(p.price)||0)),0);
    return `<div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b style="font-family:var(--font-display);font-size:13px">${revYear}년 ${mi+1}월</b>
        <div style="font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)">합계 <b style="color:var(--ink)">${usd(total)}</b> · ${won(total*settings.planRate)}</div>
      </div>
      <table class="plan-tbl"><thead><tr><th style="width:36%">제품명</th><th style="width:14%">물량</th><th style="width:14%">단가(USD)</th><th style="width:30%">자동 계산</th><th style="width:6%"></th></tr></thead><tbody>${rows||`<tr><td colspan="5" style="color:var(--ink-faint);padding:14px;text-align:center">항목 없음</td></tr>`}</tbody></table>
      <button class="btn btn-soft" style="margin-top:6px;font-size:12px;padding:6px 11px" onclick="addPlanRow('${owner}',${mi})">+ 항목 추가</button>
    </div>`;
  }).join('');
}
function planRow(owner,mi,idx,p){
  const isCost=p.product==='테라도 비용정산';
  const usdAmt=isCost?(Number(p.directUsd)||0):(Number(p.qty)||0)*(Number(p.price)||0);
  const krwAmt=usdAmt*settings.planRate;
  const prodOpts=['<option value="">선택</option>',...PRODUCTS.map(pr=>`<option ${pr===p.product?'selected':''}>${pr}</option>`),'<option value="__custom__">직접 입력</option>'].join('');
  const isCustom=p.product&&!PRODUCTS.includes(p.product);
  return `<tr>
    <td>
      <select onchange="updatePlan('${owner}',${mi},${idx},'product',this.value==='__custom__'?'':this.value)">${prodOpts.replace(`>${p.product}<`,p.product&&PRODUCTS.includes(p.product)?`>${p.product}<`:'')}${isCustom?`<option selected value="__custom__">직접 입력</option>`:''}</select>
      ${isCustom?`<input style="margin-top:4px" placeholder="직접 입력" value="${p.product||''}" oninput="updatePlan('${owner}',${mi},${idx},'product',this.value)">`:''}
    </td>
    ${isCost
      ? `<td colspan="2" class="num"><input type="number" step="0.01" min="0" placeholder="USD 직접 입력" value="${p.directUsd||''}" oninput="updatePlan('${owner}',${mi},${idx},'directUsd',this.value)"></td>`
      : `<td class="num"><input type="number" min="0" value="${p.qty||''}" oninput="updatePlan('${owner}',${mi},${idx},'qty',this.value)"></td>
         <td class="num"><input type="number" step="0.01" min="0" value="${p.price||''}" oninput="updatePlan('${owner}',${mi},${idx},'price',this.value)"></td>`}
    <td class="calc"><span class="calc-usd">${usd(usdAmt)}</span><br><span>${won(krwAmt)}</span></td>
    <td><button class="btn btn-soft" style="padding:4px 8px;font-size:11px" onclick="removePlanRow('${owner}',${mi},${idx})">×</button></td>
  </tr>`;
}
function addPlanRow(owner,mi){const key=revYear+'-'+(mi+1);if(!settings.planByOwner[owner])settings.planByOwner[owner]={};if(!settings.planByOwner[owner][key])settings.planByOwner[owner][key]=[];settings.planByOwner[owner][key].push({product:'',qty:0,price:0,directUsd:0});saveAll();renderRevenue();}
function removePlanRow(owner,mi,idx){const key=revYear+'-'+(mi+1);settings.planByOwner[owner][key].splice(idx,1);saveAll();renderRevenue();}
function updatePlan(owner,mi,idx,field,val){const key=revYear+'-'+(mi+1);const r=settings.planByOwner[owner][key][idx];if(field==='product'){r.product=val;if(val==='테라도 비용정산'){r.qty=0;r.price=0;}}else{r[field]=field==='product'?val:(Number(val)||0);}saveAll();renderRevenue();}

function setGran(g){revGran=g;renderRevenue();}
function setRevOwner(o){revOwner=o;renderRevenue();}
function setRate(k,v){settings[k]=Number(v)||0;saveAll();renderRevenue();}
function setDim(d){revDim=d;renderRevenue();}

/* ---------- AR / 매출채권 ---------- */
let arOwner='all';
function renderAR(){
  // outstanding = 선적 완료 (not yet 수금 완료) - we already shipped, awaiting payment
  // Also include those already shipped & paid for context? No, "아직 수금되지 않은" only.
  const list=state.filter(s=>isShipped(s)&&s.status!=='수금 완료');
  const filtered=arOwner==='all'?list:list.filter(s=>s.owner===arOwner);
  // totals by team & owner
  const byOwner={};OWNERS.forEach(o=>{byOwner[o]={usd:0,krw:0,count:0};});
  const byTeam={'1팀':{usd:0,krw:0,count:0},'2팀':{usd:0,krw:0,count:0}};
  list.forEach(s=>{const u=shipUsd(s),k=s.krwActual||Math.round(u*settings.estRate);
    if(byOwner[s.owner]){byOwner[s.owner].usd+=u;byOwner[s.owner].krw+=k;byOwner[s.owner].count++;}
    const t=TEAM[s.owner];if(byTeam[t]){byTeam[t].usd+=u;byTeam[t].krw+=k;byTeam[t].count++;}
  });
  const totalUsd=list.reduce((a,s)=>a+shipUsd(s),0);
  const totalKrw=list.reduce((a,s)=>a+(s.krwActual||Math.round(shipUsd(s)*settings.estRate)),0);

  const today_iso=iso(0);
  const sorted=filtered.slice().sort((a,b)=>{const da=dueDate(a)||'9999',db=dueDate(b)||'9999';return da.localeCompare(db);});
  const rows=sorted.length?sorted.map(s=>{
    const due=dueDate(s);
    let dueCell='—';
    if(due){
      const diff=daysBetween(today_iso,due);
      if(diff<0)dueCell=`<span class="due-pill over">+${-diff}Days</span>`;
      else if(diff===0)dueCell=`<span class="due-pill over">D-Day</span>`;
      else if(diff<=14)dueCell=`<span class="due-pill soon">D-${diff}</span>`;
      else dueCell=`<span class="due-pill">D-${diff}</span>`;
    }
    const u=shipUsd(s),k=s.krwActual||Math.round(u*settings.estRate);
    return `<tr><td><div class="cli">${s.client}</div><div class="po">${s.po||''}</div></td>
      <td style="font-size:12px;color:var(--ink-soft)">${s.country||'-'}</td>
      <td><div class="owner"><span class="av">${initials(s.owner)}</span>${s.owner}</div><div style="font-size:10.5px;color:var(--ink-faint);margin-top:2px">${TEAM[s.owner]||''}</div></td>
      <td style="font-size:12.5px">${s.item}</td>
      <td class="r">$${u.toLocaleString()}</td>
      <td class="r">₩${k.toLocaleString()}</td>
      <td><div style="font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)">ATD ${fmtD(s.atd)}<br>${s.inco||'-'} · ${s.terms||0}일</div></td>
      <td><div style="font-family:var(--font-mono);font-size:12px;color:var(--ink);font-weight:600">${due?due.slice(5).replace('-','/'):'—'}</div><div style="margin-top:4px">${dueCell}</div></td>
      <td><button class="btn btn-pri" style="padding:6px 12px;font-size:12px" onclick="openPayModal('${s.id}')">수금 등록</button></td>
    </tr>`;
  }).join(''):`<tr><td colspan="9" style="text-align:center;padding:38px;color:var(--ink-faint)">미수금 매출이 없습니다.</td></tr>`;

  document.getElementById('arView').innerHTML=`
    <div class="rcards">
      <div class="rcard est"><div class="lab">전체 미수금 (원화)</div><div class="val">${won(totalKrw)}</div><div class="sub">${usd(totalUsd)} · ${list.length}건</div></div>
      <div class="rcard plan"><div class="lab">1팀 미수금</div><div class="val">${won(byTeam['1팀'].krw)}</div><div class="sub">${usd(byTeam['1팀'].usd)} · ${byTeam['1팀'].count}건</div></div>
      <div class="rcard plan"><div class="lab">2팀 미수금</div><div class="val">${won(byTeam['2팀'].krw)}</div><div class="sub">${usd(byTeam['2팀'].usd)} · ${byTeam['2팀'].count}건</div></div>
      <div class="rcard gap"><div class="lab">연체 (Due 초과)</div><div class="val neg">${list.filter(s=>{const d=dueDate(s);return d&&d<today_iso;}).length}<small style="font-size:13px;color:var(--ink-faint);margin-left:4px">건</small></div><div class="sub">즉시 회수 필요</div></div>
    </div>

    <div class="owner-tabs">
      <span style="font-size:12px;color:var(--ink-faint);padding:6px 4px">담당자별 잔여 매출채권</span>
      <button class="chip ${arOwner==='all'?'on':''}" onclick="setArOwner('all')">팀 전체</button>
      ${OWNERS.map(o=>`<button class="chip ${arOwner===o?'on':''}" onclick="setArOwner('${o}')"><span class="av">${initials(o)}</span>${o} <span style="color:var(--ink-faint);margin-left:4px;font-family:var(--font-mono);font-size:10.5px">${won(byOwner[o].krw)}</span></button>`).join('')}
    </div>

    <div class="board">
      <div class="board-head"><h2>매출채권 · 수금 예정</h2><span class="count">${filtered.length}건</span></div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>거래처/PO</th><th>국가</th><th>담당</th><th>제품</th><th class="r">USD</th><th class="r">원화</th><th>선적/조건</th><th>수금 마감일</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}
function setArOwner(o){arOwner=o;renderAR();}

/* ---------- tabs & events ---------- */
function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
  document.getElementById('boardView').style.display=t==='board'?'block':'none';
  document.getElementById('revenueView').style.display=t==='rev'?'block':'none';
  document.getElementById('arView').style.display=t==='ar'?'block':'none';
  if(t==='rev')renderRevenue();else if(t==='ar')renderAR();else renderLane();}
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;scope.mode=b.dataset.scope;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));if(scope.mode==='person'&&!scope.person)scope.person=me;render();});
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;scope.person=b.dataset.person;render();});
document.getElementById('rows').addEventListener('click',e=>{if(e.target.closest('input,select,textarea,button,.ctrls,.timeline,.cmt'))return;const tr=e.target.closest('tr.row');if(!tr)return;openId=openId===tr.dataset.id?null:tr.dataset.id;render();});
document.getElementById('boardGran').addEventListener('change',e=>{boardGran=e.target.value;boardPeriod='all';render();});
document.getElementById('boardPeriod').addEventListener('change',e=>{boardPeriod=e.target.value;render();});

/* ---------- new shipment modal ---------- */
const ov=document.getElementById('overlay');
let fAdd={client:'',country:'',owner:'',cat1:'',cat2:'',item:''};
function renderAddSelects(){
  document.getElementById('f_client_box').innerHTML=soiHtml('f_client',CLIENTS,fAdd.client);
  soiCb['f_client']=v=>{fAdd.client=v;};
  document.getElementById('f_country_box').innerHTML=soiHtml('f_country',COUNTRIES,fAdd.country);
  soiCb['f_country']=v=>{fAdd.country=v;};
  document.getElementById('f_owner_box').innerHTML=soiHtml('f_owner',OWNERS,fAdd.owner);
  soiCb['f_owner']=v=>{fAdd.owner=v;};
  document.getElementById('f_cat1_box').innerHTML=soiHtml('f_cat1',CAT1_LIST,fAdd.cat1);
  soiCb['f_cat1']=v=>{fAdd.cat1=v;};
  document.getElementById('f_cat2_box').innerHTML=soiHtml('f_cat2',CAT2_LIST,fAdd.cat2);
  soiCb['f_cat2']=v=>{fAdd.cat2=v;renderItemSelect();};
  renderItemSelect();
}
function renderItemSelect(){
  const items=fAdd.cat2&&CAT2_LIST.includes(fAdd.cat2)?productsByCat2(fAdd.cat2):PRODUCTS;
  if(fAdd.item&&!items.includes(fAdd.item)&&fAdd.cat2)fAdd.item='';
  document.getElementById('f_item_box').innerHTML=soiHtml('f_item',items,fAdd.item);
  soiCb['f_item']=v=>{fAdd.item=v;if(v&&PRODUCTS.includes(v)){const c2=cat2OfProduct(v);if(c2!==fAdd.cat2){fAdd.cat2=c2;document.getElementById('f_cat2_box').innerHTML=soiHtml('f_cat2',CAT2_LIST,fAdd.cat2);soiCb['f_cat2']=v=>{fAdd.cat2=v;renderItemSelect();};}}};
}
function recalcAdd(){const q=Number(document.getElementById('f_qty').value)||0;const p=Number(document.getElementById('f_price').value)||0;const u=q*p;
  document.getElementById('f_usd').textContent='$'+u.toLocaleString();
  document.getElementById('f_krw').textContent='₩'+Math.round(u*settings.estRate).toLocaleString();}
['f_qty','f_price'].forEach(id=>document.getElementById(id).addEventListener('input',recalcAdd));
document.getElementById('openAdd').onclick=()=>{
  fAdd={client:'',country:'',owner:me,cat1:'',cat2:'',item:''};
  renderAddSelects();
  document.getElementById('f_release').value=iso(1);document.getElementById('f_etd').value=iso(3);document.getElementById('f_eta').value=iso(17);document.getElementById('f_terms').value=30;
  document.getElementById('f_qty').value='';document.getElementById('f_price').value='';document.getElementById('f_po').value='';
  recalcAdd();ov.classList.add('show');};
const closeM=()=>ov.classList.remove('show');
document.getElementById('closeAdd').onclick=closeM;document.getElementById('cancelAdd').onclick=closeM;
ov.addEventListener('click',e=>{if(e.target===ov)closeM();});
document.getElementById('shipOverlay').addEventListener('click',e=>{if(e.target.id==='shipOverlay')closeShip();});
document.getElementById('saveAdd').onclick=()=>{
  const client=soiValue('f_client');if(!client){alert('거래처를 선택/입력하세요');return;}
  const country=soiValue('f_country');
  const owner=soiValue('f_owner')||me;
  let cat2=soiValue('f_cat2');
  const item=soiValue('f_item');
  const cat1=soiValue('f_cat1');
  if(item&&PRODUCTS.includes(item)&&!cat2)cat2=cat2OfProduct(item);
  const g=id=>document.getElementById(id).value;
  const qty=Number(g('f_qty'))||0,price=Number(g('f_price'))||0;
  const ship={id:'s'+Date.now(),client,country,po:g('f_po').trim()||'',item:item||'-',cat1,cat2,qty,price,release:g('f_release')||null,etd:g('f_etd'),eta:g('f_eta'),atd:null,status:'출고 준비중',owner,inco:g('f_inco'),terms:Number(g('f_terms'))||0,shipRate:null,krwActual:null,paidAt:null,negotiation:'',history:[{who:me,text:'선적 건 등록',amt:`USD $${(qty*price).toLocaleString()} (추정환율 ₩${settings.estRate.toLocaleString()})`,at:now()}],comments:[]};
  state.unshift(ship);saveAll();closeM();render();};

/* ---------- wheel picker ---------- */
let wheelCb=null,wheelColsDef=[];
function openWheel(title,columns,values,cb){
  wheelCb=cb;wheelColsDef=columns;
  document.getElementById('wheelTitle').textContent=title;
  const box=document.getElementById('wheelCols');
  box.innerHTML='<div class="wheel-center"></div>'+columns.map((c,ci)=>{
    return `<div class="wheel-col" data-ci="${ci}"><div class="wpad"></div>${c.items.map(v=>`<div class="wheel-item" data-v="${v}">${c.fmt?c.fmt(v):v}</div>`).join('')}<div class="wpad"></div></div>`;
  }).join('');
  document.getElementById('wheelOv').classList.add('show');
  setTimeout(()=>{
    box.querySelectorAll('.wheel-col').forEach((col,i)=>{
      let idx=columns[i].items.indexOf(values[i]);if(idx<0)idx=0;
      col.scrollTop=idx*36;updateCur(col);
      let t;col.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{col.scrollTo({top:Math.round(col.scrollTop/36)*36,behavior:'smooth'});updateCur(col);},90);});
      attachDrag(col);
    });
  },20);
}
function updateCur(col){const idx=Math.round(col.scrollTop/36);col.querySelectorAll('.wheel-item').forEach((el,i)=>el.classList.toggle('cur',i===idx));}
function attachDrag(col){
  let dragging=false,startY=0,startTop=0;
  const down=e=>{dragging=true;startY=(e.touches?e.touches[0].clientY:e.clientY);startTop=col.scrollTop;e.preventDefault();};
  const move=e=>{if(!dragging)return;const y=e.touches?e.touches[0].clientY:e.clientY;col.scrollTop=startTop-(y-startY);};
  const up=()=>{if(!dragging)return;dragging=false;col.scrollTo({top:Math.round(col.scrollTop/36)*36,behavior:'smooth'});};
  col.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
}
function closeWheel(){document.getElementById('wheelOv').classList.remove('show');wheelCb=null;}
document.getElementById('wheelOk').onclick=()=>{
  const cols=document.querySelectorAll('#wheelCols .wheel-col');const out=[];
  cols.forEach((col,i)=>{const idx=Math.min(wheelColsDef[i].items.length-1,Math.max(0,Math.round(col.scrollTop/36)));out.push(wheelColsDef[i].items[idx]);});
  if(wheelCb)wheelCb(out);closeWheel();
};
document.getElementById('wheelOv').addEventListener('click',e=>{if(e.target.id==='wheelOv')closeWheel();});
function openDateWheel(title,iso,cb){
  const d=iso?new Date(iso+'T00:00:00'):new Date();
  const years=[];for(let y=today.getFullYear()-2;y<=today.getFullYear()+3;y++)years.push(y);
  const months=[];for(let mm=1;mm<=12;mm++)months.push(mm);
  const days=[];for(let dd=1;dd<=31;dd++)days.push(dd);
  openWheel(title,[
    {items:years,fmt:v=>v+'년'},
    {items:months,fmt:v=>v+'월'},
    {items:days,fmt:v=>v+'일'}
  ],[d.getFullYear(),d.getMonth()+1,d.getDate()],vals=>{
    const [y,m,da]=vals;const lastDay=new Date(y,m,0).getDate();
    const s=y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(da,lastDay)).padStart(2,'0');
    cb(s);
  });
}
function openListWheel(title,items,cur,cb,fmt){openWheel(title,[{items,fmt}],[cur],vals=>cb(vals[0]));}

(async()=>{const sv=await load('shipments_v2');state=sv&&sv.length?sv:seed;
  state.forEach(s=>{if(s.negotiation===undefined)s.negotiation='';if(s.release===undefined)s.release=null;if(s.country===undefined)s.country='';if(s.cat1===undefined)s.cat1='';if(s.cat2===undefined)s.cat2=cat2OfProduct(s.item);if(s.paidAt===undefined)s.paidAt=null;});
  const ss=await load('revsettings_v2');settings=ss&&ss.planRate&&ss.planByOwner?ss:defaultSettings();
  // ensure all owners exist in planByOwner
  OWNERS.forEach(o=>{if(!settings.planByOwner[o])settings.planByOwner[o]={};});
  const m=localStorage.getItem('me');if(m&&OWNERS.includes(m))me=m;
  fillMe();render();window.addEventListener('resize',()=>{if(document.getElementById('boardView').style.display!=='none')renderLane();});})();
</script>
